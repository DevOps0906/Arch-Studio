[package]
name = "arch-studio-desktop"
version = "0.0.0"
description = "Arch Studio 데스크톱 셸"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "arch_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
# 대화상자는 Rust API로만 연다(JS 권한 부여 안 함). tauri-plugin-fs·tauri-plugin-sql은 쓰지 않는다.
tauri-plugin-dialog = "=2.8.4"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.29", features = ["v7"] }
# OS 키체인(AR-06-005, MIT OR Apache-2.0). linux-native = keyutils(순수 Rust, 시스템 라이브러리 불필요).
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "linux-native"] }
# 라이선스·규칙 팩 서명 검증(AR-06-041, BSD-3-Clause). 검증만 쓴다(서명·난수 기능 없음). sha2 0.10은 위와 공유.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }

# 설치형 PNG 래스터화(AR-06-080). 022 웹 경로(@resvg/resvg-js 2.6.2)가 내장한 버전과 같게 정확히 고정한다 — 골든 바이트 일치.
# resvg·usvg MPL-2.0(수정 없이 사용), tiny-skia BSD-3-Clause, png·fontdb·roxmltree MIT OR Apache-2.0 계열.
# 기능 최소화: text만(system-fonts·memmap-fonts·raster-images 끔). fontdb는 fs 기능 없이 → 시스템 글꼴·글꼴 파일 로드 함수가 없다.
# png =0.17.5: resvg-js가 쓴 버전. 최신 0.17.x는 기본 필터·압축이 달라 PNG 바이트가 달라진다(픽셀은 같음).
resvg = { version = "=0.34.0", default-features = false, features = ["text"] }
usvg = { version = "=0.34.1", default-features = false, features = ["text"] }
tiny-skia = "=0.10.0"
fontdb = { version = "=0.14.1", default-features = false }
png = "=0.17.5"
# deflate =1.0.0(MIT/Apache-2.0): png 0.17.5가 IDAT 압축에 쓰는 같은 크레이트·같은 버전(새 크레이트 아님, 이미 Cargo.lock에 있음).
# PNG 결과 상한을 압축 중에 검사하려고 IDAT 압축만 직접 한다(AR-06-080 보안 리뷰). 바뀌면 골든 바이트가 달라지므로 정확히 고정.
deflate = "=1.0.0"
roxmltree = "=0.18.1"

# Windows 기기 ID(MachineGuid)는 레지스트리 API를 직접 부른다(AR-06-041 보안 리뷰: reg.exe 실행·환경 변수 경로 의존 제거).
# MIT OR Apache-2.0. keyring(windows-native)이 이미 쓰는 같은 버전이라 새 크레이트가 아니다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
# 테스트 전용: 작은 위수 R 서명 벡터를 만든다(verify_strict 회귀 방지). ed25519-dalek이 이미 쓰는 같은 버전(BSD-3-Clause).
curve25519-dalek = { version = "=4.1.3", default-features = false }
