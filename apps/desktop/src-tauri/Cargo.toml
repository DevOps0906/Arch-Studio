[package]
name = "arch-studio-desktop"
version = "0.0.0"
description = "Arch Studio 데스크톱 셸"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "arch_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
# 대화상자는 Rust API로만 연다(JS 권한 부여 안 함). tauri-plugin-fs·tauri-plugin-sql은 쓰지 않는다.
tauri-plugin-dialog = "=2.8.4"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
uuid = { version = "1.29", features = ["v7"] }
# OS 키체인(AR-06-005, MIT OR Apache-2.0). linux-native = keyutils(순수 Rust, 시스템 라이브러리 불필요).
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "linux-native"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
