# S-7 공급망(AR-06-058a [DECISION] 7): SBOM(CycloneDX)·OSV·cargo audit. 시크릿 참조 없음. spikes/* 제외.
# OSV 게이트: PR·푸시는 보고만(비차단), 주 1회 schedule 에서 취약점이 있으면 실패(High+ 필터는 후속). 릴리스 차단은 058b.
# Python 은 lock 이 없어 SBOM 이 부분 커버다(lock 도입은 후속).
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom:
    name: SBOM(JS·Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p sbom
      # pnpm 10 에는 sbom 명령이 없다 → 루트 devDependency @cyclonedx/cdxgen(lockfile 고정). 설치 스크립트·네트워크 조회 없이 lock 기준.
      - run: pnpm exec cdxgen -t js -r --required-only --no-install-deps --spec-version 1.5 -o sbom/js.cdx.json .
        env:
          CDXGEN_NO_BANNER: "true"
          FETCH_LICENSE: "false"
      - run: test -s sbom/js.cdx.json
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: cargo cyclonedx --format json --spec-version 1.5 --override-filename rust.cdx
        working-directory: apps/desktop/src-tauri
      - run: mv apps/desktop/src-tauri/rust.cdx.json sbom/rust.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  osv:
    name: OSV 스캔
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - run: mkdir -p osv
      # 보고용(비차단): lock 파일만 대상이라 spikes 는 포함되지 않는다
      - run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source --format json --output-file osv/osv.json \
            -L pnpm-lock.yaml -L apps/desktop/src-tauri/Cargo.lock || true
      # `|| true` 가 도구 자체 실패(설치·인자 오류)를 가리지 않게, 보고서가 만들어졌는지 확인한다
      - run: test -s osv/osv.json
      - if: github.event_name == 'schedule'
        run: |
          "$(go env GOPATH)/bin/osv-scanner" scan source -L pnpm-lock.yaml -L apps/desktop/src-tauri/Cargo.lock
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv
          path: osv/
          retention-days: 90
          if-no-files-found: error

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # OSV 와 같은 정책: PR·푸시는 보고만(비차단), 주간 schedule 에서 실패
      - run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
        continue-on-error: ${{ github.event_name != 'schedule' }}
