# 웹·공용 패키지 CI(AR-06-058a). 필수 검사 후보라 paths 필터를 두지 않는다. 시크릿 참조 없음.
name: web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web 린트·타입·테스트·빌드·번들 검사
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm test
      # 빌드 검증용 공개 변수 자리표시자(비밀 아님, 실제 서비스에 연결되지 않는 값). 운영 값은 배포 환경에만 둔다.
      - run: pnpm --filter ./apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon
          NEXT_PUBLIC_TOSS_CLIENT_KEY: ci-placeholder-toss
      # 클라이언트 번들: Mock·시드 이메일 문자열 0, 키 모양 비밀 0
      - run: node scripts/dev/check-bundle-mock.mjs dir apps/web/.next/static
      - run: node scripts/ci/scan-secrets.mjs dir apps/web/.next/static
