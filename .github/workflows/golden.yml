# 도면 골든 검증(AR-06-021, 02_ARCHITECTURE.md "골든 테스트와 CI"). 두 잡 중 하나라도 실패하면 머지 불가(브랜치 보호에서 필수 검사로 지정).
name: golden

on:
  pull_request:
    paths:
      - "packages/drafting/**"
      - "packages/domain/**"
      - "packages/geometry/**"
      - "scripts/golden/**"
      - ".github/workflows/golden.yml"
  push:
    branches: [main]

permissions: {}

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drafting-test:
    name: drafting 테스트(골든 바이트 비교 포함)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arch-studio/drafting test

  ezdxf-audit:
    name: 골든 DXF ezdxf audit(오류·수정 0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/golden/requirements.txt
      - run: pip install -r scripts/golden/requirements.txt
      - run: python scripts/golden/audit.py
        env:
          PYTHONUTF8: "1"
