# Arch Studio 로컬 미리보기 (앱 코드 착수 전 단계)
# 실행: docker compose up -d → http://localhost:8088
# 앱(web·api·Supabase) 서비스는 W0 AR-06-003·001 이후 이 파일에 추가한다.
name: arch-studio

services:
  preview:
    image: nginx:1.27.5-alpine
    container_name: arch-studio-preview
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./docker/preview/index.html:/usr/share/nginx/html/index.html:ro
      - ./docker/preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./design:/usr/share/nginx/html/design:ro
      - ./packages/ui/src:/usr/share/nginx/html/tokens:ro
      - ./docs/diagrams:/usr/share/nginx/html/diagrams:ro
      - ./spikes/drafting/out:/usr/share/nginx/html/drafting:ro
    restart: unless-stopped
